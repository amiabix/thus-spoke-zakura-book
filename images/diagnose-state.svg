<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="Four triage steps: does the launcher run at all, is this instance up and where, is the node healthy but the wallet stale, and only then a payment you are unsure of.">
<style>
svg {
  --bg: #fdfaf8;
  --ink: #2c2430;
  --muted: #7a6a7a;
  --rule: #e0d3da;
  --surface: #ffffff;
  --zone: #f7f0f3;
  --accent: #b24a6e;
  --accent-soft: #fceef3;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #1b171f;
    --ink: #efe8f0;
    --muted: #a695a6;
    --rule: #3d3442;
    --surface: #252030;
    --zone: #201b27;
    --accent: #e79ab7;
    --accent-soft: #3a2331;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
       "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
.t { font-size: 15px; font-weight: 600; }
.k { font-size: 10px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
.l { font-size: 13px; }
.s { font-size: 11px; fill: var(--muted); }
.a { font-size: 12px; font-weight: 600; fill: var(--accent); }
.card { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.card-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.zone { fill: var(--zone); stroke: none; }
.note { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { stroke: var(--accent); stroke-width: 2; fill: none; }
.thin { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.lead { stroke: var(--rule); stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
</style>
<defs><marker id="ar-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--accent)"/></marker><marker id="ar-n" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--rule)"/></marker></defs>
<rect width="1000" height="460" fill="var(--bg)"/>
<text class="t" x="48" y="46">Work down the layers; stop at the first one that is wrong</text>
<rect class="card" x="48" y="92" width="420" height="60" rx="8"/>
<text class="l" x="258.0" y="119.0" text-anchor="middle">Does the launcher run?</text>
<text class="s" x="258.0" y="137.0" text-anchor="middle">ths doctor · ths pull</text>
<rect class="note" x="516" y="92" width="436" height="60" rx="8"/>
<text class="l" x="734.0" y="126.0" text-anchor="middle">Docker daemon, then the three images</text>
<path class="thin" d="M468 122 L508 122" marker-end="url(#ar-n)"/>
<path class="lead" d="M258 152 L258 184"/>
<rect class="card" x="48" y="184" width="420" height="60" rx="8"/>
<text class="l" x="258.0" y="211.0" text-anchor="middle">Is this instance up, and where?</text>
<text class="s" x="258.0" y="229.0" text-anchor="middle">ths status · ths endpoints --json</text>
<rect class="note" x="516" y="184" width="436" height="60" rx="8"/>
<text class="l" x="734.0" y="218.0" text-anchor="middle">each name is its own instance</text>
<path class="thin" d="M468 214 L508 214" marker-end="url(#ar-n)"/>
<path class="lead" d="M258 244 L258 276"/>
<rect class="card" x="48" y="276" width="420" height="60" rx="8"/>
<text class="l" x="258.0" y="303.0" text-anchor="middle">Node healthy, balances stale?</text>
<text class="s" x="258.0" y="321.0" text-anchor="middle">wallet_sync in /api/v1/status</text>
<rect class="note" x="516" y="276" width="436" height="60" rx="8"/>
<text class="l" x="734.0" y="310.0" text-anchor="middle">usually lightwalletd lagging, not a lost balance</text>
<path class="thin" d="M468 306 L508 306" marker-end="url(#ar-n)"/>
<path class="lead" d="M258 336 L258 368"/>
<rect class="card-a" x="48" y="368" width="420" height="60" rx="8"/>
<text class="l" x="258.0" y="395.0" text-anchor="middle">Only then: a payment you doubt</text>
<text class="s" x="258.0" y="413.0" text-anchor="middle">/api/v1/activity, then the chain</text>
<rect class="note" x="516" y="368" width="436" height="60" rx="8"/>
<text class="l" x="734.0" y="402.0" text-anchor="middle">only a keyed payment is safe to repeat</text>
<path class="thin" d="M468 398 L508 398" marker-end="url(#ar-n)"/>
</svg>
