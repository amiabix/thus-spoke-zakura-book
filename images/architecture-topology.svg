<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Your machine holds the launcher, a browser and your own code; all four published ports bind to loopback. Inside a private Docker network sit the app, lightwalletd and Zakura containers, each backed by its own volume.">
<style>
svg {
  --bg: #fdfaf8;
  --ink: #2c2430;
  --muted: #7a6a7a;
  --rule: #e0d3da;
  --surface: #ffffff;
  --zone: #f7f0f3;
  --accent: #b24a6e;
  --accent-soft: #fceef3;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #1b171f;
    --ink: #efe8f0;
    --muted: #a695a6;
    --rule: #3d3442;
    --surface: #252030;
    --zone: #201b27;
    --accent: #e79ab7;
    --accent-soft: #3a2331;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
       "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
.t { font-size: 15px; font-weight: 600; }
.k { font-size: 10px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
.l { font-size: 13px; }
.s { font-size: 11px; fill: var(--muted); }
.a { font-size: 12px; font-weight: 600; fill: var(--accent); }
.card { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.card-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.zone { fill: var(--zone); stroke: none; }
.note { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { stroke: var(--accent); stroke-width: 2; fill: none; }
.thin { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.lead { stroke: var(--rule); stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
</style>
<defs><marker id="ar-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--accent)"/></marker><marker id="ar-n" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--rule)"/></marker></defs>
<rect width="1000" height="560" fill="var(--bg)"/>
<text class="t" x="48" y="46">One instance: three containers, four volumes</text>
<rect class="zone" x="48" y="76" width="904" height="116" rx="12"/>
<text class="k" x="64" y="98">YOUR MACHINE</text>
<rect class="card" x="72" y="110" width="264" height="56" rx="8"/>
<text class="l" x="204.0" y="135.0" text-anchor="middle">ths launcher</text>
<text class="s" x="204.0" y="153.0" text-anchor="middle">starts and deletes it</text>
<rect class="card" x="368" y="110" width="264" height="56" rx="8"/>
<text class="l" x="500.0" y="135.0" text-anchor="middle">Browser</text>
<text class="s" x="500.0" y="153.0" text-anchor="middle">the dashboard</text>
<rect class="card" x="664" y="110" width="264" height="56" rx="8"/>
<text class="l" x="796.0" y="135.0" text-anchor="middle">Your app or scripts</text>
<text class="s" x="796.0" y="153.0" text-anchor="middle">HTTP, RPC, gRPC</text>
<text class="s" x="500" y="224" text-anchor="middle">every published port binds 127.0.0.1 only</text>
<path class="lead" d="M204 192 L204 238"/>
<path class="lead" d="M796 192 L796 238"/>
<rect class="zone" x="48" y="250" width="904" height="156" rx="12"/>
<text class="k" x="64" y="272">PRIVATE DOCKER NETWORK  tsz-&lt;name&gt;</text>
<rect class="card-a" x="72" y="288" width="264" height="60" rx="8"/>
<text class="l" x="204.0" y="315.0" text-anchor="middle">app</text>
<text class="s" x="204.0" y="333.0" text-anchor="middle">tsz-server + React · :8080</text>
<rect class="card" x="368" y="288" width="264" height="60" rx="8"/>
<text class="l" x="500.0" y="315.0" text-anchor="middle">lightwalletd</text>
<text class="s" x="500.0" y="333.0" text-anchor="middle">compact blocks · :9067</text>
<rect class="card" x="664" y="288" width="264" height="60" rx="8"/>
<text class="l" x="796.0" y="315.0" text-anchor="middle">zakura</text>
<text class="s" x="796.0" y="333.0" text-anchor="middle">Regtest node · :18232</text>
<path class="flow" d="M336 318 L360 318" marker-end="url(#ar-a)"/>
<path class="flow" d="M632 318 L656 318" marker-end="url(#ar-a)"/>
<text class="k" x="500" y="432" text-anchor="middle">VOLUMES — DELETED WITH THE INSTANCE</text>
<rect class="note" x="72" y="448" width="184" height="50" rx="8"/>
<text class="l" x="164.0" y="470.0" text-anchor="middle">wallet</text>
<text class="s" x="164.0" y="488.0" text-anchor="middle">tsz.db + wallet.db</text>
<rect class="note" x="296" y="448" width="184" height="50" rx="8"/>
<text class="l" x="388.0" y="470.0" text-anchor="middle">lightwalletd</text>
<text class="s" x="388.0" y="488.0" text-anchor="middle">block cache</text>
<rect class="note" x="520" y="448" width="184" height="50" rx="8"/>
<text class="l" x="612.0" y="470.0" text-anchor="middle">chain</text>
<text class="s" x="612.0" y="488.0" text-anchor="middle">Zakura state</text>
<rect class="note" x="744" y="448" width="184" height="50" rx="8"/>
<text class="l" x="836.0" y="470.0" text-anchor="middle">config</text>
<text class="s" x="836.0" y="488.0" text-anchor="middle">zakurad.toml</text>
</svg>
