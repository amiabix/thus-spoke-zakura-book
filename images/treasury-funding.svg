<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" role="img" aria-label="A faucet request proposes a payment from the treasury's Orchard pool. With enough spendable funds it broadcasts, records and confirms. Otherwise it mines for maturity, discovers and shields a reward, and retries the proposal.">
<style>
svg {
  --bg: #fdfaf8;
  --ink: #2c2430;
  --muted: #7a6a7a;
  --rule: #e0d3da;
  --surface: #ffffff;
  --zone: #f7f0f3;
  --accent: #b24a6e;
  --accent-soft: #fceef3;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #1b171f;
    --ink: #efe8f0;
    --muted: #a695a6;
    --rule: #3d3442;
    --surface: #252030;
    --zone: #201b27;
    --accent: #e79ab7;
    --accent-soft: #3a2331;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
       "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
.t { font-size: 15px; font-weight: 600; }
.k { font-size: 10px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
.l { font-size: 13px; }
.s { font-size: 11px; fill: var(--muted); }
.a { font-size: 12px; font-weight: 600; fill: var(--accent); }
.card { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.card-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.zone { fill: var(--zone); stroke: none; }
.note { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { stroke: var(--accent); stroke-width: 2; fill: none; }
.thin { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.lead { stroke: var(--rule); stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
</style>
<defs><marker id="ar-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--accent)"/></marker><marker id="ar-n" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--rule)"/></marker></defs>
<rect width="1040" height="420" fill="var(--bg)"/>
<text class="t" x="48" y="46">A faucet payment, and the detour when funds are short</text>
<rect class="card" x="48" y="104" width="228" height="60" rx="8"/>
<text class="l" x="162.0" y="131.0" text-anchor="middle">Faucet request</text>
<text class="s" x="162.0" y="149.0" text-anchor="middle">account + pool + amount</text>
<rect class="card" x="324" y="104" width="228" height="60" rx="8"/>
<text class="l" x="438.0" y="131.0" text-anchor="middle">Propose from treasury</text>
<text class="s" x="438.0" y="149.0" text-anchor="middle">the SDK decides spendability</text>
<rect class="card" x="600" y="104" width="180" height="60" rx="8"/>
<text class="l" x="690.0" y="131.0" text-anchor="middle">Broadcast</text>
<text class="s" x="690.0" y="149.0" text-anchor="middle">through lightwalletd</text>
<rect class="card" x="828" y="104" width="164" height="60" rx="8"/>
<text class="l" x="910.0" y="131.0" text-anchor="middle">Record + confirm</text>
<text class="s" x="910.0" y="149.0" text-anchor="middle">txid, then a block</text>
<path class="flow" d="M276 134 L316 134" marker-end="url(#ar-a)"/>
<path class="flow" d="M552 134 L592 134" marker-end="url(#ar-a)"/>
<text class="s" x="572.0" y="120" text-anchor="middle">enough funds</text>
<path class="flow" d="M780 134 L820 134" marker-end="url(#ar-a)"/>
<path class="flow" d="M400 164 L400 208 L162 208 L162 256" marker-end="url(#ar-a)"/>
<text class="s" x="281" y="200" text-anchor="middle">insufficient spendable Orchard funds</text>
<rect class="card" x="48" y="264" width="228" height="60" rx="8"/>
<text class="l" x="162.0" y="291.0" text-anchor="middle">Mine for maturity</text>
<text class="s" x="162.0" y="309.0" text-anchor="middle">100 confirmations</text>
<rect class="card" x="324" y="264" width="228" height="60" rx="8"/>
<text class="l" x="438.0" y="291.0" text-anchor="middle">Discover the reward</text>
<text class="s" x="438.0" y="309.0" text-anchor="middle">match the coinbase output</text>
<rect class="card" x="600" y="264" width="228" height="60" rx="8"/>
<text class="l" x="714.0" y="291.0" text-anchor="middle">Shield it</text>
<text class="s" x="714.0" y="309.0" text-anchor="middle">into the treasury's Orchard pool</text>
<path class="flow" d="M276 294 L316 294" marker-end="url(#ar-a)"/>
<path class="flow" d="M552 294 L592 294" marker-end="url(#ar-a)"/>
<path class="flow" d="M714 264 L714 226 L476 226 L476 170" marker-end="url(#ar-a)"/>
<text class="s" x="595" y="218" text-anchor="middle">retry the proposal</text>
<text class="s" x="520" y="388" text-anchor="middle">so one faucet call can move the chain by more than one block</text>
</svg>
