<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="1080" height="340" role="img" aria-label="ths mine N posts to the mine endpoint, which validates the count, asks Zakura to generate the blocks, waits for lightwalletd to index and the wallet to scan, then returns the block hashes. A failure after generate is not a rollback.">
<style>
svg {
  --bg: #fdfaf8;
  --ink: #2c2430;
  --muted: #7a6a7a;
  --rule: #e0d3da;
  --surface: #ffffff;
  --zone: #f7f0f3;
  --accent: #b24a6e;
  --accent-soft: #fceef3;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #1b171f;
    --ink: #efe8f0;
    --muted: #a695a6;
    --rule: #3d3442;
    --surface: #252030;
    --zone: #201b27;
    --accent: #e79ab7;
    --accent-soft: #3a2331;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
       "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
.t { font-size: 15px; font-weight: 600; }
.k { font-size: 10px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
.l { font-size: 13px; }
.s { font-size: 11px; fill: var(--muted); }
.a { font-size: 12px; font-weight: 600; fill: var(--accent); }
.card { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.card-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.zone { fill: var(--zone); stroke: none; }
.note { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { stroke: var(--accent); stroke-width: 2; fill: none; }
.thin { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.lead { stroke: var(--rule); stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
</style>
<defs><marker id="ar-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--accent)"/></marker><marker id="ar-n" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--rule)"/></marker></defs>
<rect width="1080" height="340" fill="var(--bg)"/>
<text class="t" x="48" y="46">An explicit mine request</text>
<rect class="card" x="48" y="112" width="152" height="64" rx="8"/>
<text class="l" x="124.0" y="141.0" text-anchor="middle">ths mine N</text>
<text class="s" x="124.0" y="159.0" text-anchor="middle">or the Mine dialog</text>
<rect class="card" x="260" y="112" width="152" height="64" rx="8"/>
<text class="l" x="336.0" y="141.0" text-anchor="middle">Validate</text>
<text class="s" x="336.0" y="159.0" text-anchor="middle">1 to 10,000</text>
<rect class="card-a" x="472" y="112" width="152" height="64" rx="8"/>
<text class="l" x="548.0" y="141.0" text-anchor="middle">Zakura generates</text>
<text class="s" x="548.0" y="159.0" text-anchor="middle">blocks + hashes</text>
<rect class="card" x="684" y="112" width="152" height="64" rx="8"/>
<text class="l" x="760.0" y="141.0" text-anchor="middle">Index + scan</text>
<text class="s" x="760.0" y="159.0" text-anchor="middle">then reconcile</text>
<rect class="card" x="896" y="112" width="152" height="64" rx="8"/>
<text class="l" x="972.0" y="141.0" text-anchor="middle">Return</text>
<text class="s" x="972.0" y="159.0" text-anchor="middle">blocks and hashes</text>
<path class="flow" d="M200 144.0 L252 144.0" marker-end="url(#ar-a)"/>
<path class="flow" d="M412 144.0 L464 144.0" marker-end="url(#ar-a)"/>
<path class="flow" d="M624 144.0 L676 144.0" marker-end="url(#ar-a)"/>
<path class="flow" d="M836 144.0 L888 144.0" marker-end="url(#ar-a)"/>
<rect class="note" x="260" y="244" width="588" height="50" rx="8"/>
<text class="l" x="554.0" y="266.0" text-anchor="middle">A failure after generate is not a rollback</text>
<text class="s" x="554.0" y="284.0" text-anchor="middle">the blocks stay on the chain; the call still returns an error</text>
<path class="lead" d="M548 176 L548 244"/>
</svg>
