<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 452" width="1160" height="452" role="img" aria-label="A send or faucet request is validated, then its idempotency key is looked up. A recorded key returns the stored activity. A new key is built and broadcast, then recorded, then confirmed. The broadcast happens before the record, so a crash in between leaves a live transaction with no row.">
<style>
svg {
  --bg: #fdfaf8;
  --ink: #2c2430;
  --muted: #7a6a7a;
  --rule: #e0d3da;
  --surface: #ffffff;
  --zone: #f7f0f3;
  --accent: #b24a6e;
  --accent-soft: #fceef3;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #1b171f;
    --ink: #efe8f0;
    --muted: #a695a6;
    --rule: #3d3442;
    --surface: #252030;
    --zone: #201b27;
    --accent: #e79ab7;
    --accent-soft: #3a2331;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
       "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
.t { font-size: 15px; font-weight: 600; }
.k { font-size: 10px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
.l { font-size: 13px; }
.s { font-size: 11px; fill: var(--muted); }
.a { font-size: 12px; font-weight: 600; fill: var(--accent); }
.card { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.card-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.zone { fill: var(--zone); stroke: none; }
.note { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { stroke: var(--accent); stroke-width: 2; fill: none; }
.thin { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.lead { stroke: var(--rule); stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
</style>
<defs><marker id="ar-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--accent)"/></marker><marker id="ar-n" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--rule)"/></marker></defs>
<rect width="1160" height="452" fill="var(--bg)"/>
<text class="t" x="48" y="46">A payment, and the gap that makes a lost response ambiguous</text>
<rect class="card" x="48" y="100" width="232" height="60" rx="8"/>
<text class="l" x="164.0" y="127.0" text-anchor="middle">POST /send</text>
<text class="s" x="164.0" y="145.0" text-anchor="middle">or POST /faucet</text>
<rect class="card" x="320" y="100" width="232" height="60" rx="8"/>
<text class="l" x="436.0" y="127.0" text-anchor="middle">Validate</text>
<text class="s" x="436.0" y="145.0" text-anchor="middle">accounts, pools, memo, key</text>
<rect class="card" x="592" y="100" width="232" height="60" rx="8"/>
<text class="l" x="708.0" y="127.0" text-anchor="middle">Look up the key</text>
<text class="s" x="708.0" y="145.0" text-anchor="middle">in tsz.db</text>
<rect class="note" x="864" y="100" width="232" height="60" rx="8"/>
<text class="l" x="980.0" y="127.0" text-anchor="middle">Return the stored row</text>
<text class="s" x="980.0" y="145.0" text-anchor="middle">nothing is built</text>
<path class="flow" d="M280 130 L312 130" marker-end="url(#ar-a)"/>
<path class="flow" d="M552 130 L584 130" marker-end="url(#ar-a)"/>
<path class="flow" d="M824 130 L856 130" marker-end="url(#ar-a)"/>
<text class="s" x="840" y="86" text-anchor="middle">recorded</text>
<path class="flow" d="M708 160 L708 200 L436 200 L436 252" marker-end="url(#ar-a)"/>
<text class="s" x="572" y="192" text-anchor="middle">new key</text>
<rect class="card" x="320" y="252" width="232" height="60" rx="8"/>
<text class="l" x="436.0" y="279.0" text-anchor="middle">Build + broadcast</text>
<text class="s" x="436.0" y="297.0" text-anchor="middle">through lightwalletd</text>
<rect class="card" x="592" y="252" width="232" height="60" rx="8"/>
<text class="l" x="708.0" y="279.0" text-anchor="middle">Record in tsz.db</text>
<text class="s" x="708.0" y="297.0" text-anchor="middle">txid + key, status broadcast</text>
<rect class="card" x="864" y="252" width="232" height="60" rx="8"/>
<text class="l" x="980.0" y="279.0" text-anchor="middle">Confirm</text>
<text class="s" x="980.0" y="297.0" text-anchor="middle">mine one block if needed</text>
<path class="flow" d="M552 282 L584 282" marker-end="url(#ar-a)"/>
<path class="flow" d="M824 282 L856 282" marker-end="url(#ar-a)"/>
<rect class="card-a" x="432" y="352" width="288" height="50" rx="8"/>
<text class="l" x="576.0" y="374.0" text-anchor="middle">Ambiguous gap</text>
<text class="s" x="576.0" y="392.0" text-anchor="middle">the broadcast happens first</text>
<path class="lead" d="M568 312 L568 352"/>
<text class="s" x="560" y="424" text-anchor="middle">a missing activity row does not prove nothing was sent</text>
</svg>
