<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" role="img" aria-label="If the call was a send or faucet you chose the idempotency key, so look at the activity: a row with your key can be resent safely, while no row does not prove nothing was broadcast. Mine and address-faucet take no key, so compare the chain instead.">
<style>
svg {
  --bg: #fdfaf8;
  --ink: #2c2430;
  --muted: #7a6a7a;
  --rule: #e0d3da;
  --surface: #ffffff;
  --zone: #f7f0f3;
  --accent: #b24a6e;
  --accent-soft: #fceef3;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #1b171f;
    --ink: #efe8f0;
    --muted: #a695a6;
    --rule: #3d3442;
    --surface: #252030;
    --zone: #201b27;
    --accent: #e79ab7;
    --accent-soft: #3a2331;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
       "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
.t { font-size: 15px; font-weight: 600; }
.k { font-size: 10px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
.l { font-size: 13px; }
.s { font-size: 11px; fill: var(--muted); }
.a { font-size: 12px; font-weight: 600; fill: var(--accent); }
.card { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.card-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.zone { fill: var(--zone); stroke: none; }
.note { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { stroke: var(--accent); stroke-width: 2; fill: none; }
.thin { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.lead { stroke: var(--rule); stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
</style>
<defs><marker id="ar-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--accent)"/></marker><marker id="ar-n" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--rule)"/></marker></defs>
<rect width="1040" height="440" fill="var(--bg)"/>
<text class="t" x="48" y="46">What a lost response lets you conclude</text>
<rect class="card-a" x="348" y="92" width="344" height="56" rx="8"/>
<text class="l" x="520.0" y="117.0" text-anchor="middle">The response never arrived</text>
<text class="s" x="520.0" y="135.0" text-anchor="middle">which call was it?</text>
<rect class="card" x="48" y="196" width="424" height="60" rx="8"/>
<text class="l" x="260.0" y="223.0" text-anchor="middle">send or faucet</text>
<text class="s" x="260.0" y="241.0" text-anchor="middle">you chose the idempotency key</text>
<rect class="card" x="568" y="196" width="424" height="60" rx="8"/>
<text class="l" x="780.0" y="223.0" text-anchor="middle">mine or faucet/address</text>
<text class="s" x="780.0" y="241.0" text-anchor="middle">no key, nothing to replay</text>
<path class="flow" d="M520 148 L520 170 L260 170 L260 188" marker-end="url(#ar-a)"/>
<path class="flow" d="M520 148 L520 170 L780 170 L780 188" marker-end="url(#ar-a)"/>
<rect class="card" x="48" y="296" width="200" height="60" rx="8"/>
<text class="l" x="148.0" y="323.0" text-anchor="middle">Row with your key</text>
<text class="s" x="148.0" y="341.0" text-anchor="middle">resend it — no second payment</text>
<rect class="note" x="272" y="296" width="200" height="60" rx="8"/>
<text class="l" x="372.0" y="323.0" text-anchor="middle">No row</text>
<text class="s" x="372.0" y="341.0" text-anchor="middle">not proof nothing was sent</text>
<path class="lead" d="M148 256 L148 288"/>
<path class="lead" d="M372 256 L372 288"/>
<rect class="card" x="568" y="296" width="424" height="60" rx="8"/>
<text class="l" x="780.0" y="323.0" text-anchor="middle">Compare the chain</text>
<text class="s" x="780.0" y="341.0" text-anchor="middle">tip height, or the destination balance</text>
<path class="lead" d="M780 256 L780 288"/>
<text class="s" x="520" y="400" text-anchor="middle">look at GET /api/v1/activity and the chain before deciding to call again</text>
</svg>
