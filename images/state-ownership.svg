<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" role="img" aria-label="The chain flows left to right from Zakura through lightwalletd's index into the server wallet's scan, which publishes an account snapshot the dashboard reads. SQLite activity is a separate path written when the server sends, not when it scans.">
<style>
svg {
  --bg: #fdfaf8;
  --ink: #2c2430;
  --muted: #7a6a7a;
  --rule: #e0d3da;
  --surface: #ffffff;
  --zone: #f7f0f3;
  --accent: #b24a6e;
  --accent-soft: #fceef3;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #1b171f;
    --ink: #efe8f0;
    --muted: #a695a6;
    --rule: #3d3442;
    --surface: #252030;
    --zone: #201b27;
    --accent: #e79ab7;
    --accent-soft: #3a2331;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
       "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
.t { font-size: 15px; font-weight: 600; }
.k { font-size: 10px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
.l { font-size: 13px; }
.s { font-size: 11px; fill: var(--muted); }
.a { font-size: 12px; font-weight: 600; fill: var(--accent); }
.card { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.card-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.zone { fill: var(--zone); stroke: none; }
.note { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { stroke: var(--accent); stroke-width: 2; fill: none; }
.thin { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.lead { stroke: var(--rule); stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
</style>
<defs><marker id="ar-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--accent)"/></marker><marker id="ar-n" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--rule)"/></marker></defs>
<rect width="1120" height="400" fill="var(--bg)"/>
<text class="t" x="48" y="46">One change, and who owns each answer</text>
<rect class="card" x="48" y="110" width="144" height="64" rx="8"/>
<text class="l" x="120.0" y="139.0" text-anchor="middle">Zakura</text>
<text class="s" x="120.0" y="157.0" text-anchor="middle">chain, tip hash</text>
<rect class="card" x="268" y="110" width="144" height="64" rx="8"/>
<text class="l" x="340.0" y="139.0" text-anchor="middle">lightwalletd</text>
<text class="s" x="340.0" y="157.0" text-anchor="middle">compact index</text>
<rect class="card" x="488" y="110" width="144" height="64" rx="8"/>
<text class="l" x="560.0" y="139.0" text-anchor="middle">wallet.db</text>
<text class="s" x="560.0" y="157.0" text-anchor="middle">scan + rewind</text>
<rect class="card-a" x="708" y="110" width="144" height="64" rx="8"/>
<text class="l" x="780.0" y="139.0" text-anchor="middle">Snapshot</text>
<text class="s" x="780.0" y="157.0" text-anchor="middle">balances, sync state</text>
<rect class="card" x="928" y="110" width="144" height="64" rx="8"/>
<text class="l" x="1000.0" y="139.0" text-anchor="middle">Dashboard</text>
<text class="s" x="1000.0" y="157.0" text-anchor="middle">query hooks</text>
<path class="flow" d="M192 142.0 L260 142.0" marker-end="url(#ar-a)"/>
<text class="s" x="230.0" y="98" text-anchor="middle">blocks</text>
<path class="flow" d="M412 142.0 L480 142.0" marker-end="url(#ar-a)"/>
<text class="s" x="450.0" y="98" text-anchor="middle">compact blocks</text>
<path class="flow" d="M632 142.0 L700 142.0" marker-end="url(#ar-a)"/>
<text class="s" x="670.0" y="98" text-anchor="middle">canonical check</text>
<path class="flow" d="M852 142.0 L920 142.0" marker-end="url(#ar-a)"/>
<text class="s" x="890.0" y="98" text-anchor="middle">/api/v1/accounts</text>
<rect class="card" x="48" y="276" width="364" height="56" rx="8"/>
<text class="l" x="230.0" y="301.0" text-anchor="middle">tsz.db activity</text>
<text class="s" x="230.0" y="319.0" text-anchor="middle">txid + idempotency key, written on send</text>
<rect class="card" x="488" y="276" width="364" height="56" rx="8"/>
<text class="l" x="670.0" y="301.0" text-anchor="middle">GET /api/v1/activity</text>
<text class="s" x="670.0" y="319.0" text-anchor="middle">what this server did</text>
<path class="thin" d="M412 304 L480 304" marker-end="url(#ar-n)"/>
<text class="s" x="560" y="356" text-anchor="middle">a separate path — activity is not a balance ledger</text>
</svg>
