<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 566" width="1040" height="566" role="img" aria-label="The web and server sources build the app image, the lightwalletd Dockerfile builds the lightwalletd image, and Zakura is pinned and pulled. ths start refuses to run until all three exist. Editing source changes neither a running container nor an existing image.">
<style>
svg {
  --bg: #fdfaf8;
  --ink: #2c2430;
  --muted: #7a6a7a;
  --rule: #e0d3da;
  --surface: #ffffff;
  --zone: #f7f0f3;
  --accent: #b24a6e;
  --accent-soft: #fceef3;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #1b171f;
    --ink: #efe8f0;
    --muted: #a695a6;
    --rule: #3d3442;
    --surface: #252030;
    --zone: #201b27;
    --accent: #e79ab7;
    --accent-soft: #3a2331;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
       "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
.t { font-size: 15px; font-weight: 600; }
.k { font-size: 10px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
.l { font-size: 13px; }
.s { font-size: 11px; fill: var(--muted); }
.a { font-size: 12px; font-weight: 600; fill: var(--accent); }
.card { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.card-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.zone { fill: var(--zone); stroke: none; }
.note { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { stroke: var(--accent); stroke-width: 2; fill: none; }
.thin { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.lead { stroke: var(--rule); stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
</style>
<defs><marker id="ar-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--accent)"/></marker><marker id="ar-n" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--rule)"/></marker></defs>
<rect width="1040" height="566" fill="var(--bg)"/>
<text class="t" x="48" y="46">Source reaches a run only through an image</text>
<rect class="zone" x="48" y="76" width="944" height="120" rx="12"/>
<text class="k" x="64" y="98">SOURCE IN THIS REPOSITORY</text>
<rect class="card" x="72" y="108" width="264" height="66" rx="8"/>
<text class="l" x="204.0" y="138.0" text-anchor="middle">web/</text>
<text class="s" x="204.0" y="156.0" text-anchor="middle">React dashboard</text>
<rect class="card" x="360" y="108" width="264" height="66" rx="8"/>
<text class="l" x="492.0" y="138.0" text-anchor="middle">crates/tsz-server/</text>
<text class="s" x="492.0" y="156.0" text-anchor="middle">HTTP API and wallet</text>
<rect class="card" x="648" y="108" width="320" height="66" rx="8"/>
<text class="l" x="808.0" y="145.0" text-anchor="middle">docker/lightwalletd.Dockerfile</text>
<path class="flow" d="M204 174 L204 248" marker-end="url(#ar-a)"/>
<path class="flow" d="M492 174 L492 248" marker-end="url(#ar-a)"/>
<path class="flow" d="M808 174 L808 248" marker-end="url(#ar-a)"/>
<text class="a" x="268" y="218" text-anchor="middle">ths build</text>
<text class="a" x="872" y="218" text-anchor="middle">ths build</text>
<rect class="zone" x="48" y="248" width="944" height="186" rx="12"/>
<text class="k" x="64" y="270">IMAGES — THE ONLY THING A RUN USES</text>
<rect class="card" x="72" y="280" width="552" height="62" rx="8"/>
<text class="l" x="348.0" y="308.0" text-anchor="middle">app:&lt;version&gt;</text>
<text class="s" x="348.0" y="326.0" text-anchor="middle">web/ and the server crate, together</text>
<rect class="card" x="648" y="280" width="320" height="62" rx="8"/>
<text class="l" x="808.0" y="308.0" text-anchor="middle">lightwalletd:&lt;version&gt;</text>
<text class="s" x="808.0" y="326.0" text-anchor="middle">from that Dockerfile</text>
<rect class="card" x="360" y="364" width="320" height="54" rx="8"/>
<text class="l" x="520.0" y="388.0" text-anchor="middle">zakuracore/zakura:1.4.0</text>
<text class="s" x="520.0" y="406.0" text-anchor="middle">pinned — ths pull, never built here</text>
<path class="flow" d="M520 434 L520 466" marker-end="url(#ar-a)"/>
<rect class="card-a" x="292" y="466" width="456" height="46" rx="8"/>
<text class="l" x="520.0" y="486.0" text-anchor="middle">ths start</text>
<text class="s" x="520.0" y="504.0" text-anchor="middle">refuses to run until all three exist</text>
<text class="s" x="520" y="540" text-anchor="middle">editing source changes neither a running container nor an image that exists</text>
</svg>
