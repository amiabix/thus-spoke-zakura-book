<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 452" width="1240" height="452" role="img" aria-label="Five startup stages left to right: ths start, checking Docker and images, claiming the fixed loopback ports, starting Zakura then lightwalletd then the app, and ready. A note records that init derives the fixed seed and that a fresh chain opens near height 103. Below, Ctrl+C or any failure deletes only this instance.">
<style>
svg {
  --bg: #fdfaf8;
  --ink: #2c2430;
  --muted: #7a6a7a;
  --rule: #e0d3da;
  --surface: #ffffff;
  --zone: #f7f0f3;
  --accent: #b24a6e;
  --accent-soft: #fceef3;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #1b171f;
    --ink: #efe8f0;
    --muted: #a695a6;
    --rule: #3d3442;
    --surface: #252030;
    --zone: #201b27;
    --accent: #e79ab7;
    --accent-soft: #3a2331;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
       "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
.t { font-size: 15px; font-weight: 600; }
.k { font-size: 10px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
.l { font-size: 13px; }
.s { font-size: 11px; fill: var(--muted); }
.a { font-size: 12px; font-weight: 600; fill: var(--accent); }
.card { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.card-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.zone { fill: var(--zone); stroke: none; }
.note { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { stroke: var(--accent); stroke-width: 2; fill: none; }
.thin { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.lead { stroke: var(--rule); stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
</style>
<defs><marker id="ar-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--accent)"/></marker><marker id="ar-n" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--rule)"/></marker></defs>
<rect width="1240" height="452" fill="var(--bg)"/>
<text class="t" x="48" y="46">Starting an instance, and throwing it away</text>
<rect class="card" x="48" y="108" width="190" height="60" rx="8"/>
<text class="l" x="143.0" y="135.0" text-anchor="middle">ths start</text>
<text class="s" x="143.0" y="153.0" text-anchor="middle">--name, --port-offset</text>
<rect class="card" x="287" y="108" width="190" height="60" rx="8"/>
<text class="l" x="382.0" y="135.0" text-anchor="middle">Check Docker</text>
<text class="s" x="382.0" y="153.0" text-anchor="middle">all three images</text>
<rect class="card" x="526" y="108" width="190" height="60" rx="8"/>
<text class="l" x="621.0" y="135.0" text-anchor="middle">Claim ports</text>
<text class="s" x="621.0" y="153.0" text-anchor="middle">32805 · 18232 · 18233 · 9067</text>
<rect class="card" x="765" y="108" width="190" height="60" rx="8"/>
<text class="l" x="860.0" y="135.0" text-anchor="middle">Start services</text>
<text class="s" x="860.0" y="153.0" text-anchor="middle">Zakura → lightwalletd → app</text>
<rect class="card-a" x="1004" y="108" width="190" height="60" rx="8"/>
<text class="l" x="1099.0" y="135.0" text-anchor="middle">Ready</text>
<text class="s" x="1099.0" y="153.0" text-anchor="middle">endpoints printed</text>
<path class="flow" d="M238 138.0 L279 138.0" marker-end="url(#ar-a)"/>
<path class="flow" d="M477 138.0 L518 138.0" marker-end="url(#ar-a)"/>
<path class="flow" d="M716 138.0 L757 138.0" marker-end="url(#ar-a)"/>
<path class="flow" d="M955 138.0 L996 138.0" marker-end="url(#ar-a)"/>
<rect class="note" x="692" y="214" width="500" height="50" rx="8"/>
<text class="l" x="942.0" y="236.0" text-anchor="middle">The chain opens near height 103, not 1</text>
<text class="s" x="942.0" y="254.0" text-anchor="middle">coinbase maturity first, then Account 1 gets 5 Orchard ZEC</text>
<path class="lead" d="M860 168 L860 214"/>
<path class="lead" d="M1099 168 L1099 214"/>
<rect class="card" x="48" y="340" width="320" height="60" rx="8"/>
<text class="l" x="208.0" y="367.0" text-anchor="middle">Ctrl+C, or any failure</text>
<text class="s" x="208.0" y="385.0" text-anchor="middle">at any stage above</text>
<rect class="card" x="520" y="340" width="600" height="60" rx="8"/>
<text class="l" x="820.0" y="367.0" text-anchor="middle">Deletes this instance only</text>
<text class="s" x="820.0" y="385.0" text-anchor="middle">its containers, its four volumes, its network</text>
<path class="flow" d="M368 370 L512 370" marker-end="url(#ar-a)"/>
<path class="lead" d="M621 168 L621 310 L208 310 L208 332"/>
</svg>
