<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="About every two seconds the server asks Zakura for its height and hash and compares them with the wallet's scanned checkpoint. When they match it stays ready; when either moved it waits for the index, rewinds if the stored hashes disagree, rescans and publishes. On error the last good snapshot stays visible.">
<style>
svg {
  --bg: #fdfaf8;
  --ink: #2c2430;
  --muted: #7a6a7a;
  --rule: #e0d3da;
  --surface: #ffffff;
  --zone: #f7f0f3;
  --accent: #b24a6e;
  --accent-soft: #fceef3;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #1b171f;
    --ink: #efe8f0;
    --muted: #a695a6;
    --rule: #3d3442;
    --surface: #252030;
    --zone: #201b27;
    --accent: #e79ab7;
    --accent-soft: #3a2331;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
       "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
.t { font-size: 15px; font-weight: 600; }
.k { font-size: 10px; font-weight: 600; letter-spacing: .1em; fill: var(--muted); }
.l { font-size: 13px; }
.s { font-size: 11px; fill: var(--muted); }
.a { font-size: 12px; font-weight: 600; fill: var(--accent); }
.card { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.card-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.zone { fill: var(--zone); stroke: none; }
.note { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { stroke: var(--accent); stroke-width: 2; fill: none; }
.thin { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.lead { stroke: var(--rule); stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
</style>
<defs><marker id="ar-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--accent)"/></marker><marker id="ar-n" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--rule)"/></marker></defs>
<rect width="1000" height="440" fill="var(--bg)"/>
<text class="t" x="48" y="46">How the wallet catches up with the node</text>
<rect class="card" x="48" y="100" width="260" height="60" rx="8"/>
<text class="l" x="178.0" y="127.0" text-anchor="middle">Ask Zakura for its tip</text>
<text class="s" x="178.0" y="145.0" text-anchor="middle">height and hash, every 2s</text>
<rect class="card" x="372" y="100" width="260" height="60" rx="8"/>
<text class="l" x="502.0" y="127.0" text-anchor="middle">Compare with the wallet</text>
<text class="s" x="502.0" y="145.0" text-anchor="middle">fully scanned checkpoint</text>
<rect class="note" x="696" y="100" width="256" height="60" rx="8"/>
<text class="l" x="824.0" y="127.0" text-anchor="middle">Stay ready</text>
<text class="s" x="824.0" y="145.0" text-anchor="middle">nothing to do</text>
<path class="flow" d="M308 130 L364 130" marker-end="url(#ar-a)"/>
<path class="flow" d="M632 130 L688 130" marker-end="url(#ar-a)"/>
<text class="s" x="660.0" y="116" text-anchor="middle">same pair</text>
<path class="flow" d="M502 160 L502 200 L178 200 L178 236" marker-end="url(#ar-a)"/>
<text class="s" x="340" y="192" text-anchor="middle">height or hash moved</text>
<rect class="card" x="48" y="244" width="260" height="60" rx="8"/>
<text class="l" x="178.0" y="271.0" text-anchor="middle">Wait for the index</text>
<text class="s" x="178.0" y="289.0" text-anchor="middle">lightwalletd reaches that height</text>
<rect class="card" x="372" y="244" width="260" height="60" rx="8"/>
<text class="l" x="502.0" y="271.0" text-anchor="middle">Rewind if hashes differ</text>
<text class="s" x="502.0" y="289.0" text-anchor="middle">back to the last match</text>
<rect class="card-a" x="696" y="244" width="256" height="60" rx="8"/>
<text class="l" x="824.0" y="271.0" text-anchor="middle">Rescan and publish</text>
<text class="s" x="824.0" y="289.0" text-anchor="middle">then report ready</text>
<path class="flow" d="M308 274 L364 274" marker-end="url(#ar-a)"/>
<path class="flow" d="M632 274 L688 274" marker-end="url(#ar-a)"/>
<rect class="note" x="288" y="344" width="424" height="50" rx="8"/>
<text class="l" x="500.0" y="366.0" text-anchor="middle">On error, the last good snapshot stays visible</text>
<text class="s" x="500.0" y="384.0" text-anchor="middle">state reports error until a scan succeeds</text>
<path class="lead" d="M502 304 L502 344"/>
<text class="s" x="500" y="424" text-anchor="middle">then the loop comes round again, about two seconds later</text>
</svg>
